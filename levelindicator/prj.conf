# Core GPIO & I2C
CONFIG_GPIO=y
CONFIG_I2C=y

# Sensors (MPU-6050 6-Axis IMU)
CONFIG_SENSOR=y
CONFIG_MPU6050=y
CONFIG_MPU6050_TRIGGER_NONE=y

# Display (SSD1306 128x64 OLED)
CONFIG_DISPLAY=y
CONFIG_SSD1306=y

# Serial Console over USB-Serial-JTAG
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Floating Point Formatting & Math Library
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_PICOLIBC=y

# Application Stack
CONFIG_MAIN_STACK_SIZE=4096
